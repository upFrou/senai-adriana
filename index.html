<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>CEP</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

#video-fundo {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -1;
}
/* botão lilás */
.btn-lilas{
    background-color: #6093d4;
    color: white;
}

.btn-lilas:hover{
    background-color: #68b2f0;
}

/* caixa */
.caixa {
    max-width: 350px;
    margin: 70px auto;
    padding: 20px;
    border: 1px solid #031833;
    border-radius: 20px;
    background-position: center;  
    background-color: rgb(23, 103, 168);
}
</style>

</head>

<body>

<video autoplay muted loop id="video-fundo">
<source src="cachoeira.mp4" type="video/mp4">
</video>

<div class="caixa">

    <h4 style="color: #020101;">Consultar CEP</h4>

    <input type="text" id="cep" class="form-control mb-2" placeholder="Digite o CEP">

    <button class="btn btn-lilas mb-3" onclick="buscarCEP()"><b style="color: rgb(2, 11, 12);""> Buscar</b>

    </button>

    <input type="text" id="rua" class="form-control mb-2" placeholder="Rua" readonly>
    <input type="text" id="bairro" class="form-control mb-2" placeholder="Bairro" readonly>
    <input type="text" id="cidade" class="form-control mb-2" placeholder="Cidade" readonly>

</div>

<script>
function buscarCEP(){

    let cep = document.getElementById("cep").value;

    fetch(`https://viacep.com.br/ws/${cep}/json/`)
    .then(r => r.json())
    .then(d => {

        document.getElementById("rua").value = d.logradouro;
        document.getElementById("bairro").value = d.bairro;
        document.getElementById("cidade").value = d.localidade;

    });

}
</script>



</body>
</html>
