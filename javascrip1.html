<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<input type="text" id="cep" placeholder="Digite o CEP">
<button onclick="buscarCEP()">Buscar</button>

<h3>Endereço:</h3>

<p>Rua: <span id="rua"></span></p>
<p>Bairro: <span id="bairro"></span></p>
<p>Cidade: <span id="cidade"></span></p>

<script>

function buscarCEP() {
    let cep = document.getElementById("cep").value;
    fetch("https://viacep.com.br/ws/" + cep + "/json/")
    .then(resposta => resposta.json())
    .then(dados => {
        document.getElementById("rua").innerText = dados.logradouro;
        document.getElementById("bairro").innerText = dados.bairro;
        document.getElementById("cidade").innerText = dados.localidade;

    });

}

</script>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
