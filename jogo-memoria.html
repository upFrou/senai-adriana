<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Memória — SENAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   🎨 VARIÁVEIS — ALTERE AQUI PARA MUDAR O VISUAL DO JOGO
   ============================================================ */
:root {
  /* Fundo geral (mais escuro, sujo, survival) */
  --cor-fundo: #070b08;
  --cor-painel: #111915;
  --cor-borda: #1c2a21;

  /* Carta (mais orgânico, verde escuro) */
  --cor-carta-verso: #15211a;
  --cor-carta-frente: #0f1713;
  --cor-carta-borda: #24362b;
  --cor-carta-hover: #1e2f25;

  /* Estados (infectado / survival) */
  --cor-acerto: #4ee3a0;   /* verde vivo tipo “cura” */
  --cor-erro: #e05252;     /* sangue/alerta */
  --cor-destaque: #7fb38a; /* verde apagado natural */
  --cor-ouro: #c7b98a;     /* sujeira/metal velho */

  /* Texto mais “apagado survival” */
  --cor-texto: #d7e0d7;
  --cor-texto-dim: #6f7f73;

  /* Mantém igual */
  --fonte-titulo: 'Syne', sans-serif;
  --fonte-corpo: 'Space Mono', monospace;

  --tamanho-carta: 100px;
  --gap-grade: 8px;
  --raio-carta: 10px;
  --raio-painel: 14px;

  --emoji-size: 2.3rem;
}
/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 60% at 20% 10%, #1a0a3e55 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%, #001a3e44 0%, transparent 60%),
    url('yh.jpg');

  background-color: var(--cor-fundo);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  font-family: Arial, Helvetica, sans-serif;
  color: var(--cor-texto);

  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem 3rem;
  gap: 1.5rem;
}

/* ============================================================
   CABEÇALHO
   ============================================================ */
header {
  text-align: center;
  animation: fadeDown 0.6s ease both;
}

header h1 {
  background: linear-gradient(90deg, #556B2F, #8B4513);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;

  font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 800;
}

header p {
  font-size: 0.78rem;
  color: rgb(136, 83, 15);
  margin-top: 4px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ============================================================
   PLACAR
   ============================================================ */
.placar {
  display: flex;
  gap: 1rem;
  animation: fadeDown 0.6s 0.1s ease both;
  background: rgba(10, 15, 10, 0.85); /* exemplo estilo The Last of Us */
  padding: 1rem;
  border-radius: var(--raio-painel);
  border: 1px solid var(--cor-borda);
  backdrop-filter: blur(6px);
}
.stat {
  background: rgba(10, 15, 12, 0.85);
  backdrop-filter: blur(6px);  /* verde quase preto */
  border: 1px solid rgba(120, 140, 120, 0.25);
  border-radius: var(--raio-painel);
  padding: 0.7rem 1.4rem;
  text-align: center;
  min-width: 90px;
  transition: transform 0.2s;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
}
.stat:hover { transform: translateY(-2px); }
.stat-valor {
  font-family: var(--fonte-titulo);
  font-size: 1.8rem;
  font-weight: 700;
  color: rgba(210, 220, 210, 0.9); /* branco esverdeado apagado */
  letter-spacing: 1px;
}

.stat-valor.pulsar { animation: pulsar 0.4s ease; }

.stat-label {
  font-size: 0.65rem;
  color: rgba(160, 170, 160, 0.6);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ============================================================
   GRADE DE CARTAS
   ============================================================ */
.grade {
  display: grid;
  grid-template-columns: repeat(4, var(--tamanho-carta));
  gap: 6px;
  justify-content: center;
}
/* ============================================================
   CARTA — PERSPECTIVA 3D
   ============================================================ */
.carta {
  width: var(--tamanho-carta);
  aspect-ratio: 1 / 1;
  cursor: pointer;
  perspective: 600px;
  animation: entrar 0.5s ease both;

}

/* atraso escalonado por índice (definido via JS) */

.carta {
  width: clamp(60px, 8vw, 110px);
  aspect-ratio: 1 / 1;
  cursor: pointer;
  perspective: 600px;
  animation: entrar 0.5s ease both;
}

.carta.virada .carta-inner,
.carta.acertada .carta-inner {
  transform: rotateY(180deg);
}

/* Faces */
.carta-frente,
.carta-verso {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(80, 110, 90, 0.35);

  display: flex;
  align-items: center;
  justify-content: center;

  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* frente virada */
.carta-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform .6s;
  transform-style: preserve-3d;
}

.carta-frente img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
}
.carta-verso {
  background: #1c2a21;
  border-radius: 10px;
}

.carta-frente {
  background: #111915;
  border-radius: 10px;
  transform: rotateY(180deg);
}

/* Estado acertado */
.carta.acertada .carta-frente {
  border-color: rgba(120, 200, 140, 0.5);
  background: rgba(10, 25, 18, 0.95);
  box-shadow: 0 0 12px rgba(0, 200, 120, 0.15),
              inset 0 0 20px rgba(0, 255, 150, 0.05);
}
/* Estado errado */
.carta.errado .carta-frente {
  border-color: rgba(200, 80, 80, 0.4);
  background: rgba(30, 10, 15, 0.9);
}
/* ============================================================
   MENSAGEM DE VITÓRIA
   ============================================================ */
.vitoria {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.8rem;

  background: rgba(25, 35, 28, 0.85);
  border: 1px solid rgba(140, 160, 140, 0.25);

  border-radius: var(--raio-painel);
  padding: 2rem 2.5rem;
  text-align: center;

  backdrop-filter: blur(4px);
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);

  animation: escalar 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.vitoria-imagens {
  font-size: 3.2rem;
  opacity: 0.85;
  animation: flutuar 3s ease-in-out infinite;
}
.vitoria h2 {
  font-family: var(--fonte-titulo);
  font-size: 1.8rem;

  color: rgba(220, 230, 220, 0.9);
  letter-spacing: 1px;
}
.vitoria p {
  font-size: 0.8rem;
  color: rgba(180, 190, 180, 0.6);
}
/* ============================================================
   BOTÃO
   ============================================================ */
button {
  font-family: var(--fonte-corpo);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--cor-fundo);
  background: linear-gradient(135deg, var(--cor-destaque), var(--cor-acerto));
  border: none;
  border-radius: 50px;
  padding: 0.75rem 2rem;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
  box-shadow: 0 4px 20px #7c6af740;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px #7c6af760;
}

button:active { transform: translateY(0); opacity: 0.85; }

/* ============================================================
   BARRA DE PROGRESSO
   ============================================================ */
.progresso-wrap {
  width: min(440px, 90vw);
  height: 4px;
  background: var(--cor-borda);
  border-radius: 4px;
  overflow: hidden;
  animation: fadeUp 0.6s 0.3s ease both;
}

.progresso-barra {
  height: 100%;
  background: linear-gradient(90deg, var(--cor-destaque), var(--cor-acerto));
  border-radius: 4px;
  width: 0%;
  transition: width 0.5s ease;
}

/* ============================================================
   RODAPÉ DICA
   ============================================================ */
.dica {
  font-size: 0.68rem;
  color: var(--cor-texto-dim);
  letter-spacing: 1px;
  animation: fadeUp 0.6s 0.4s ease both;
}

.dica code {
  color: var(--cor-destaque);
  background: #7c6af715;
  padding: 1px 6px;
  border-radius: 4px;
}

/* ============================================================
   ANIMAÇÕES
   ============================================================ */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes entrar {
  from { opacity: 0; transform: scale(0.6) rotateY(-30deg); }
  to   { opacity: 1; transform: scale(1) rotateY(0); }
}

@keyframes pulsar {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.25); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: rotateY(180deg) translateX(0); }
  20%       { transform: rotateY(180deg) translateX(-6px); }
  40%       { transform: rotateY(180deg) translateX(6px); }
  60%       { transform: rotateY(180deg) translateX(-4px); }
  80%       { transform: rotateY(180deg) translateX(4px); }
}

@keyframes brilharAcerto {
  0%   { box-shadow: 0 0 0 0 #00e5a060; }
  60%  { box-shadow: 0 0 24px 8px #00e5a040; }
  100% { box-shadow: 0 0 18px #00e5a040; }
}

@keyframes girar {
  from { transform: rotate(0); }
  to   { transform: rotate(360deg); }
}

@keyframes escalar {
  from { opacity: 0; transform: scale(0.7); }
  to   { opacity: 1; transform: scale(1); }
}

@keyframes flutuar {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-8px); }
}

/* ============================================================
   RESPONSIVO
   ============================================================ */
@media (max-width: 480px) {
  :root {
    --tamanho-carta: 72px;
    --gap-grade: 8px;
    --emoji-size: 1.8rem;
  }
}
</style>
</head>
<body>

<header>
  <h1>🧠 Jogo da Memória</h1>
  <p>the last of us</p>
</header>

<!-- PLACAR -->
<div class="placar">
  <div class="stat">
    <div class="stat-valor" id="tentativas">0</div>
    <div class="stat-label">Tentativas</div>
  </div>
  <div class="stat">
    <div class="stat-valor" id="acertos">0</div>
    <div class="stat-label">Acertos</div>
  </div>
  <div class="stat">
    <div class="stat-valor" id="tempo">0s</div>
    <div class="stat-label">Tempo</div>
  </div>
</div>

<!-- BARRA DE PROGRESSO -->
<div class="progresso-wrap">
  <div class="progresso-barra" id="progresso"></div>
</div>

<!-- GRADE DE CARTAS -->
<div class="grade" id="grade" role="list" aria-label="Grade de cartas do jogo da memória"></div>

<!-- MENSAGEM DE VITÓRIA -->
<div class="vitoria" id="vitoria" role="alert" aria-live="polite">
  <div class="vitoria-emoji">🏆</div>
  <h2>Parabéns!</h2>
  <p id="msg-vitoria">Você completou o jogo!</p>
</div>
<div class="vitoria" id="derrota">
  <div class="vitoria-emoji">☠️</div>
  <h2>Você Perdeu!</h2>
  <p>O tempo acabou.</p>
</div>
<!-- BOTÃO -->
<button id="btn-reiniciar" onclick="iniciarJogo()">↺ Novo Jogo</button>

<!-- DICA PARA ALUNOS -->
<p class="dica">
  Dica: edite as variáveis <code>:root</code> no CSS para mudar o visual!
</p>

<script>
// ============================================================
//  🎮 CONFIGURAÇÕES — altere aqui para personalizar
// ============================================================
  const imagens = [ 'arma.jpg' , 'cogumelo.png' , 'eri.jpg' , 'OIP.jpg', 'tre.jpg' , 'thumb-1920-1295032.jpg' , 'jj.jpg', 'l.jpg'];
// Dica: troque por outros emojis ou use letras, números, etc.
const somDerrota = new Audio('zumbi.mp3');
const TOTAL_PARES = imagens.length; // 8 pares = 16 cartas

// ============================================================
//  ESTADO DO JOGO
// ============================================================
let cartasViradas  = [];   // cartas atualmente viradas (max 2)
let acertos        = 0;    // pares encontrados
let tentativas     = 0;    // total de tentativas
let bloqueado      = false;// impede clique durante animação
let inicio         = null; // timestamp de início
let timerID        = null; // ID do setInterval do cronômetro
let tempoRestante = 30;

// ============================================================
//  INICIALIZAR / REINICIAR JOGO
// ============================================================
function iniciarJogo() {
  // Resetar estado
  cartasViradas = [];
  acertos       = 0;
  tentativas    = 0;
  bloqueado     = false;

  // Resetar UI
  document.getElementById('tentativas').textContent = '0';
  document.getElementById('acertos').textContent    = '0';
tempoRestante = 30;
document.getElementById('tempo').textContent = '00:30';
  document.getElementById('progresso').style.width  = '0%';
  document.getElementById('vitoria').classList.remove('visivel');

  // Parar cronômetro anterior
  clearInterval(timerID);
  inicio  = Date.now();
  timerID = setInterval(atualizarTempo, 1000);

  // Criar e embaralhar cartas
  const pares    = [...imagens, ...imagens];
  const embaralhadas = embaralhar(pares);

  // Renderizar grade
  const grade = document.getElementById('grade');
  grade.innerHTML = '';

  embaralhadas.forEach((imagem, i) => {
    const carta = document.createElement('div');
    carta.className = 'carta';
    carta.setAttribute('role', 'listitem');
    carta.setAttribute('aria-label', 'Carta virada para baixo');
    carta.style.animationDelay = `${i * 40}ms`;
    carta.dataset.imagem = imagem;

    carta.innerHTML = `
      <div class="carta-inner">
        <div class="carta-verso">
          <span class="icone-verso">✦</span>
        </div>
        <div class="carta-frente" aria-hidden="true">
  <img src="${imagem}" alt="Carta">
</div>
      </div>`;

    carta.addEventListener('click', () => clicarCarta(carta));
    grade.appendChild(carta);
  });
}

// ============================================================
//  LÓGICA: CLICAR NUMA CARTA
// ============================================================
function clicarCarta(carta) {
  // Ignorar clique em carta já virada, acertada, ou durante animação
  if (
    bloqueado ||
    carta.classList.contains('virada') ||
    carta.classList.contains('acertada')
  ) return;

  // Virar a carta
  carta.classList.add('virada');
  carta.setAttribute('aria-label', `Carta: ${carta.dataset.imagem}`);
  cartasViradas.push(carta);

  // Se só uma carta virada, aguardar próxima
  if (cartasViradas.length < 2) return;

  // Duas cartas viradas: verificar par
  bloqueado = true;
  tentativas++;
  atualizarStat('tentativas', tentativas);

  const [c1, c2] = cartasViradas;

  if (c1.dataset.imagem === c2.dataset.imagem) {
    // ✅ PAR ENCONTRADO
    setTimeout(() => {
      c1.classList.add('acertada');
      c2.classList.add('acertada');
      c1.classList.remove('virada');
      c2.classList.remove('virada');
      c1.setAttribute('aria-label', `Par encontrado: ${c1.dataset.imagem}`);
      c2.setAttribute('aria-label', `Par encontrado: ${c2.dataset.imagem}`);
      cartasViradas = [];
      bloqueado     = false;

      acertos++;
      atualizarStat('acertos', acertos);
      atualizarProgresso(acertos / TOTAL_PARES * 100);

      if (acertos === TOTAL_PARES) exibirVitoria();
    }, 400);

  } else {
    // ❌ NÃO É PAR
    c1.classList.add('errado');
    c2.classList.add('errado');

    setTimeout(() => {
      c1.classList.remove('virada', 'errado');
      c2.classList.remove('virada', 'errado');
      c1.setAttribute('aria-label', 'Carta virada para baixo');
      c2.setAttribute('aria-label', 'Carta virada para baixo');
      cartasViradas = [];
      bloqueado     = false;
    }, 900);
  }
}

// ============================================================
//  VITÓRIA
// ============================================================
function exibirVitoria() {
  clearInterval(timerID);
  const segundos = 30 - tempoRestante;
  const eficiencia = Math.round((TOTAL_PARES / tentativas) * 100);

  document.getElementById('msg-vitoria').textContent =
    `${tentativas} tentativas · ${segundos}s · ${eficiencia}% de eficiência`;

  setTimeout(() => {
    document.getElementById('vitoria').classList.add('visivel');
  }, 300);
}

// ============================================================
//  AUXILIARES
// ============================================================
function embaralhar(arr) {
  // Fisher-Yates shuffle
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function atualizarStat(id, valor) {
  const el = document.getElementById(id);
  el.textContent = valor;
  el.classList.remove('pulsar');
  void el.offsetWidth; // reflow para reiniciar animação
  el.classList.add('pulsar');
}

function atualizarTempo() {

  document.getElementById('tempo').textContent =
    `${tempoRestante}s`;

  tempoRestante--;

  if (tempoRestante < 0) {
    clearInterval(timerID);
    
somDerrota.play();

    alert("⏰ Tempo esgotado!");

    document.querySelectorAll('.carta').forEach(carta => {
      carta.style.pointerEvents = 'none';
    });
  }
}

function atualizarProgresso(pct) {
  document.getElementById('progresso').style.width = `${pct}%`;
}

// ============================================================
//  INICIAR AO CARREGAR
// ============================================================
iniciarJogo();
</script>
</body>
</html>
